name: fetch-audio
on:
  workflow_dispatch:
  push:
    paths: ['audio/fetch.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download audio chunks
        run: |
          cd audio
          while read -r u; do
            [ -z "$u" ] && continue
            f=$(basename "$u")
            [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "$u"
            file "$f"
          done < fetch.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add audio/*.mp3
          git diff --cached --quiet || (git commit -m "audio: self-host voice chunks" && git push)
